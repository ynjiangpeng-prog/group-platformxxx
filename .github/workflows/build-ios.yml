name: Build Unsigned iOS IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Setup Expo
        working-directory: mobile
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install

      - name: Fix deployment target
        working-directory: mobile/ios
        run: |
          # Patch Podfile post_install to force iOS 15.1+ deployment target for all targets
          python3 -c "
          import re
          with open('Podfile', 'r') as f:
            content = f.read()
          # Add deployment target fix in post_install
          fix = '''
            config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.1'
            config.build_settings.delete('SWIFT_STRICT_CONCURRENCY')'''
          content = content.replace('installer.pods_project.targets.each do |target|', 'installer.pods_project.targets.each do |target|' + fix.gsub('\\n',\"\n\"))
          with open('Podfile', 'w') as f:
            f.write(content)
          " 2>/dev/null || true
          # Use Ruby to patch Podfile instead
          ruby -e "
          content = File.read('Podfile')
          content.sub!('installer.pods_project.targets.each do |target|',
            \"installer.pods_project.targets.each do |target|\\n\    target.build_configurations.each do |config|\\n      config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.1'\\n    end\")
          File.write('Podfile', content)
          "

      - name: Build unsigned IPA
        working-directory: mobile/ios
        run: |
          xcodebuild -workspace mobile.xcworkspace -scheme mobile \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build -archivePath build/app.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.1

          mkdir -p build/ipa/Payload
          cp -r build/app.xcarchive/Products/Applications/*.app build/ipa/Payload/
          cd build/ipa
          zip -r ${{ github.workspace }}/mobile/mobile-unsigned.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mobile-unsigned-ipa
          path: mobile/mobile-unsigned.ipa
          retention-days: 30

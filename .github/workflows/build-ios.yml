name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Setup Expo
        working-directory: mobile
        run: |
          npx expo prebuild --platform ios --clean

      - name: Build unsigned IPA
        working-directory: mobile/ios
        run: |
          xcodebuild \
            -workspace mobile.xcworkspace \
            -scheme mobile \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -archivePath build/mobile.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            GCC_PREPROCESSOR_DEFINITIONS='$(GCC_PREPROCESSOR_DEFINITIONS) DEBUG=0'

          mkdir -p build/ipa/Payload
          cp -r build/mobile.xcarchive/Products/Applications/mobile.app build/ipa/Payload/
          cd build/ipa
          zip -r ${{ github.workspace }}/mobile/mobile-unsigned.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mobile-unsigned-ipa
          path: mobile/mobile-unsigned.ipa
          retention-days: 30

name: Build Unsigned iOS IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Setup Expo
        working-directory: mobile
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Build unsigned IPA
        working-directory: mobile/ios
        run: |
          xcodebuild -workspace mobile.xcworkspace -scheme mobile \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build -archivePath build/app.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            GCC_WARN_INHIBIT_ALL_WARNINGS=NO

          mkdir -p build/ipa/Payload
          cp -r build/app.xcarchive/Products/Applications/*.app build/ipa/Payload/
          cd build/ipa
          zip -r ${{ github.workspace }}/mobile/mobile-unsigned.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mobile-unsigned-ipa
          path: mobile/mobile-unsigned.ipa
          retention-days: 30
